<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0f1e36"/>
      <stop offset="1" stop-color="#14325e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      .name{font:700 64px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#ffffff;letter-spacing:1px}
      .role{font:400 22px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#9ecbff}
      .node{fill:#58a6ff}
      .link{stroke:#58a6ff;stroke-opacity:.35;stroke-width:1.5}
      .pulse{animation:p 3s ease-in-out infinite}
      .d2{animation-delay:1s}.d3{animation-delay:2s}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.8}}
    </style>
  </defs>
  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>

  <!-- cluster motif: connected compute nodes on the right -->
  <g>
    <line class="link" x1="880" y1="70" x2="980" y2="120"/>
    <line class="link" x1="980" y1="120" x2="1090" y2="75"/>
    <line class="link" x1="980" y1="120" x2="960" y2="200"/>
    <line class="link" x1="980" y1="120" x2="1080" y2="185"/>
    <line class="link" x1="880" y1="70" x2="860" y2="160"/>
    <line class="link" x1="860" y1="160" x2="960" y2="200"/>
    <line class="link" x1="1090" y1="75" x2="1080" y2="185"/>
    <circle class="node" cx="980" cy="120" r="9"/>
    <circle class="node pulse" cx="880" cy="70" r="6"/>
    <circle class="node pulse d2" cx="1090" cy="75" r="6"/>
    <circle class="node pulse d3" cx="960" cy="200" r="6"/>
    <circle class="node pulse" cx="1080" cy="185" r="6"/>
    <circle class="node pulse d2" cx="860" cy="160" r="6"/>
  </g>

  <path d="M0 215 C 250 185, 450 250, 700 222 S 1050 190, 1200 215 L1200 246 Q1200 260 1186 260 L14 260 Q0 260 0 246 Z" fill="url(#wave)"/>

  <text class="name" x="70" y="128">Sai Vidith</text>
  <text class="role" x="72" y="170">Full-Stack &amp; AI/ML Engineer  |  Distributed systems, RAG, agents</text>
</svg>
